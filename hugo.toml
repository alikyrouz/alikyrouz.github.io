baseURL = 'https://alikyrouz.github.io/'
locale = 'en-us'
title = 'alison kyrouz'
theme = 'cactus'

[pagination]
  pagerSize = 8                     # posts per archive page

[taxonomies]
  tag = "tags"
  category = "categories"

[markup]
  [markup.highlight]
    style = "monokai"               # any Chroma style (hugo gen chromastyles)
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true                   # allow raw HTML in Markdown

# Required for the client-side search index (/index.json)
[outputs]
  home = ["HTML", "RSS", "JSON"]

# Navigation menu
[menus]
  [[menus.main]]
    name = "home"
    url = "/"
    weight = 1
  [[menus.main]]
    name = "about"
    url = "/about/"
    weight = 2
  [[menus.main]]
    name = "articles"
    url = "/posts/"
    weight = 3
  [[menus.main]]
    name = "Tags"
    url = "/tags/"
    weight = 4
  [[menus.main]]
    name = "search"
    url = "/search/"
    weight = 5

    [params]
  author = "Ali Kyrouz"
  description = "data analyst, science communication enthusiast, computational humanities proponent"
  dateFormat = "2 Jan 2006"         # Go time layout, e.g. "14 Nov 2016"
  direction = "ltr"                 # "rtl" loads the Vazir font
  projectsUrl = "https://github.com/alikyrouz"

  # Look & feel (compiled into the stylesheet via Dart Sass)
  colorscheme = "dark"              # dark | light | classic | white
  pageWidth = 48                    # page width in rem

  rss = true                        # show the RSS feed link

  # Logo / avatar in the header
  [params.logo]
    enabled = true
    width = 50
    height = 50
    url = "/images/favicon-32x32.png"
    gravatar = false                # use your Gravatar instead of `url`
    grayout = true                  # grayscale until hovered

  # Favicons
  [params.favicon]
    [params.favicon.desktop]
      url = "/images/favicon_city.ico"
    [params.favicon.android]
      url = "/images/favicon-32x32.png"
    [params.favicon.apple]
      url = "/images/apple-touch-icon.png"

  # Gravatar (used by logo/favicon when their `gravatar = true`)
  [params.gravatar]
    email = "ajkyrouz@gmail.com"
    hash = ""                       # or an md5 hash instead of the email

  # Home page overview
  [params.tagsOverview]
    enabled = false                 # show a tag cloud on the home page
  [params.postsOverview]
    showAllPosts = false            # true = paginate all posts; false = recent N
    postCount = 5                   # N most-recent posts when showAllPosts = false
    sortUpdated = false             # sort by last-modified instead of date
  [params.archive]
    sortUpdated = false
  [params.post]
    showUpdated = false             # show "Updated:" date on posts

  # Footer copyright years (blank endYear = current year)
  [params.copyright]
    startYear = 2026
    # endYear = 2025

  # 404 page
  [params.error404]
    enabled = true
    title = "404 Page Not Found"
    description = "The page you are looking for might have been removed."

  # Open Graph / social metadata
  [params.openGraph]
    fbAppId = ""
    fbAdmins = ""
    twitterId = ""

  # Math typesetting
  [params.mathjax]
    enabled = false

  # Comments — Disqus
  [params.disqus]
    enabled = false
    shortname = ""

  # Comments — utterances
  [params.utterances]
    enabled = false
    repo = "owner/repo"
    issueTerm = "pathname"          # pathname | url | title | …
    label = "Comment"
    theme = "github-dark"

  # Analytics
  [params.googleAnalytics]
    enabled = false
    id = ""
  [params.baiduAnalytics]
    enabled = false
    id = ""
  [params.cloudflareAnalytics]
    enabled = false
    id = ""
  [params.umamiAnalytics]
    enabled = false
    id = ""
    host = "https://analytics.example.com"
    scriptName = "umami.js"

  # Load assets from a CDN instead of bundling them locally
  [params.cdn]
    enable = true
    fontAwesome = "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"

  # Social links — repeat the block per account.
  # `icon` is a Font Awesome brand name (or "mail" / "rss"); `label` is optional.
  [[params.socialLinks]]
    icon = "github"
    link = "https://github.com/alikyrouz"
  [[params.socialLinks]]  
    icon = "linkedin"
    link = "https://linkedin.com/in/ali-kyrouz"
  [[params.socialLinks]]
    icon = "mail"
    link = "mailto:ajkyrouz@gmail.com"

[caches]
  [caches.images]
    dir = ':cacheDir/images'